<style>
:root{--ink:#0f1c1a;--paper:#f4efe6;--card:#fbf8f2;--mut:#5d6663;--ac:#d4472a;--br:#b6862f;--ln:#d9d1c2;--bg:var(--paper);--fg:var(--ink);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1413;--fg:#efe9dc;--card:#142220;--mut:#9aa6a2;--ln:#26373a}}

html{scroll-padding-top:70px;scroll-behavior:smooth}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}

a{color:inherit}.w{max-width:1160px;margin:auto;padding:0 20px}.s{padding:clamp(56px,9vw,112px) 0}
.eb{font:600 .72rem Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);margin-bottom:14px;display:block}
.mut{color:var(--mut)}.skip{position:absolute;left:-999px}.skip:focus{left:10px;top:10px;background:#fff;color:#000;padding:8px;z-index:99}
:focus-visible{outline:3px solid var(--br);outline-offset:3px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}

.logo{font:600 1.25rem Fraunces;text-decoration:none;display:flex;gap:8px;align-items:center}.logo i{width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--ac) 0 33%,var(--br) 0 66%,var(--ink) 0);display:inline-block}
nav{display:flex;gap:4px;align-items:center}nav a{padding:8px 11px;border-radius:99px;text-decoration:none;font-size:.9rem;color:var(--mut)}nav a:hover,nav a[aria-current]{color:var(--fg);background:var(--card)}

.btn.g{background:none;color:var(--fg);border:1px solid var(--fg)}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;min-height:82vh}@media(max-width:860px){.hero{grid-template-columns:1fr;min-height:0}}

.shelf{display:flex;align-items:flex-end;gap:6px;height:380px;justify-content:center;perspective:900px}
.sp{width:46px;border-radius:3px 3px 1px 1px;position:relative;transform-origin:bottom;transition:transform .5s cubic-bezier(.2,.8,.2,1);animation:rise .9s both;box-shadow:inset -6px 0 12px #0003}
.sp span{position:absolute;top:14px;left:50%;writing-mode:vertical-rl;transform:translateX(-50%) rotate(180deg);font:600 .72rem Fraunces;color:#fff;white-space:nowrap;max-height:85%;overflow:hidden}
.sp:hover{transform:translateY(-22px) rotateZ(-2deg)}@keyframes rise{from{transform:translateY(60px);opacity:0}}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}.st div{padding:28px 20px;border-right:1px solid var(--ln)}.st b{font:400 clamp(2rem,5vw,3.4rem) Fraunces;display:block}
.viz{display:grid;grid-template-columns:1fr 1fr;gap:32px}@media(max-width:800px){.viz{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:26px}
.bar{display:grid;grid-template-columns:130px 1fr 44px;gap:12px;align-items:center;margin:12px 0;font-size:.88rem}.bar i{height:12px;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--br));width:0;transition:width 1.3s cubic-bezier(.2,.8,.2,1);display:block}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}.ch button{background:none;border:1px solid var(--ln);color:var(--fg);padding:8px 16px;border-radius:99px;font:inherit;font-size:.88rem;cursor:pointer}.ch button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px}
.bk{cursor:pointer;background:none;border:0;text-align:left;color:inherit;font:inherit;padding:0}.cv{aspect-ratio:3/4;border-radius:4px 10px 10px 4px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;position:relative;overflow:hidden;box-shadow:6px 8px 22px #0003;transition:transform .4s}.bk:hover .cv{transform:translateY(-8px) rotate(-1deg)}
.cv svg{position:absolute;inset:0;width:100%;height:100%;opacity:.28}.cv b{font:600 1.15rem/1.15 Fraunces;position:relative}.cv small{position:relative;opacity:.85}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}.card h3{margin-bottom:10px}.card a.l{color:var(--ac);font-weight:500;text-decoration:none}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s,transform .8s}.rv.in{opacity:1;transform:none}
.dk{background:var(--ink);color:#efe9dc}.dk .mut{color:#a9b5b1}
.ph{aspect-ratio:16/10;border-radius:18px;background:radial-gradient(circle at 20% 30%,var(--br),transparent 45%),radial-gradient(circle at 80% 70%,var(--ac),transparent 40%),var(--ink);display:grid;place-items:center;color:#fff;font:italic 1.6rem Fraunces;text-align:center;padding:24px}
.pg{padding:56px 0 20px}.pg p{max-width:68ch}.pg h2{margin:44px 0 14px;font-size:1.7rem}
form label{display:block;font-size:.85rem;margin:14px 0 4px}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--fg);font:inherit}
footer{border-top:1px solid var(--ln);padding:48px 0 70px;font-size:.9rem}footer .w{display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px}@media(max-width:700px){footer .w{grid-template-columns:1fr}}footer a{display:block;text-decoration:none;color:var(--mut);padding:3px 0}
dialog{border:1px solid var(--ln);border-radius:18px;background:var(--card);color:var(--fg);max-width:520px;width:92%;padding:28px}dialog::backdrop{background:#000a}
#ad{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:none}#ap textarea{min-height:230px;font:12px/1.4 ui-monospace,monospace}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}

ecomes print, EPUB, audio and structured data."},{"t":"Aggregation done right: metadata is the product","c":"Aggregation","dt":"Aug 2026","d":"Clean, rights-aware metadata makes catalogues discoverable and licensable."}],"jobs":[{"t":"Commissioning Editor","l":"New Delhi · Full-time","d":"Acquire and shape titles across school and higher education."},{"t":"Rights & Licensing Associate","l":"New Delhi · Full-time","d":"Draft, track and renew content licences with partners."},{"t":"Metadata & Data Specialist","l":"New Delhi · Hybrid","d":"Own catalogue quality, taxonomy and structured exports."}],"inds":[{"n":"Education & EdTech","d":"Curriculum-aligned content for schools, universities and learning platforms."},{"n":"Government & Public Sector","d":"Skilling, literacy and training material at national scale."},{"n":"Corporate Learning","d":"Professional and soft-skills content for enterprise academies."},{"n":"Libraries & Distribution","d":"Catalogues, bundles and subscriptions for institutions."},{"n":"AI & Technology","d":"Rights-cleared, well-described corpora for responsible model development."},{"n":"Media & Publishing","d":"Co-publishing, translation and syndication partnerships."}]}</script>
<script>
const SRC="<!doctype html>"+document.documentElement.outerHTML;
let D=JSON.parse(document.getElementById("d").textContent);
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PAL=["#b8432a","#1f4d47","#6b3a5b","#8a6a1f","#24415f","#3d5a2e"];
const hv=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const NAV=[["","Home"],["about","About"],["services","Services"],["industries","Industries"],["insights","Insights"],["careers","Careers"],["contact","Contact"]];
const SV={licensing:["Content Licensing","Rights-cleared content for platforms, institutions and developers.","We structure clear, auditable licences for text, assessments and multimedia — with transparent provenance, defined usage scopes and renewable terms. Every licensed asset carries rights metadata so partners can deploy with confidence.",["Territory, term and format-specific licences","Provenance and rights documentation","Revenue-share and flat-fee models","Reporting and renewals management"]],publishing:["Book Publishing","From manuscript to print, digital and audio.","Our editors work with authors on commissioning, development, design and production. One source of truth feeds print, EPUB, accessible formats and structured data.",["Commissioning and editorial development","Design, typesetting and accessibility","Print, digital and audio distribution","Co-publishing and translation"]],aggregator:["Content Aggregation","Many authors, one governed catalogue.","We bring together content from authors and publishers, normalise it with consistent metadata and taxonomy, and make it discoverable and licensable as a single catalogue.",["Onboarding and rights verification","Metadata, taxonomy and quality control","Bundles, collections and subscriptions","Catalogue APIs and exports on request"]],ai:["AI Training Content","High-quality, licensed corpora for responsible AI.","Developers need content they can trust. We offer curated, rights-cleared datasets with documented sourcing, subject tagging and quality review — created with author consent and clear commercial terms.",["Consent-based, auditable sourcing","Subject, level and language tagging","Custom dataset curation","Evaluation and assessment content"]]};
const rv=()=>{const o=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");o.unobserve(x.target);x.target.querySelectorAll("[data-n]").forEach(cnt);x.target.querySelectorAll("[data-w]").forEach(b=>b.style.width=b.dataset.w+"%");x.target.querySelectorAll(".dr").forEach(p=>p.style.strokeDashoffset=0)}}),{threshold:.15});document.querySelectorAll(".rv").forEach(e=>o.observe(e))};
function cnt(el){const t=+el.dataset.n,s=el.dataset.s||"",st=performance.now();(function f(n){const p=Math.min((n-st)/1400,1);el.textContent=Math.round(t*(1-Math.pow(1-p,3))).toLocaleString("en-IN")+s;if(p<1)requestAnimationFrame(f)})(st)}
const cover=(b,i)=>{const h=hv(b.t),c=PAL[h%6];return `<button class="bk" data-i="${i}" aria-label="${esc(b.t)} by ${esc(b.a)}"><div class="cv" style="background:linear-gradient(150deg,${c},#0f1c1a)"><svg viewBox="0 0 100 130" aria-hidden="true">${[...Array(5)].map((_,k)=>`<circle cx="${(h>>k*3)%100}" cy="${(h>>(k+2))%130}" r="${10+(h>>k)%38}" fill="none" stroke="#fff" stroke-width=".6"/>`).join("")}</svg><small>${esc(b.c)}</small><span><b>${esc(b.t)}</b><br><small>${esc(b.a)}</small></span></div></button>`};
const shelf=()=>D.books.slice(0,8).map((b,i)=>`<div class="sp" style="height:${210+(hv(b.t)%150)}px;background:${PAL[hv(b.t)%6]};animation-delay:${i*.08}s"><span>${esc(b.t)}</span></div>`).join("");
const bars=()=>{const m=Math.max(...D.cats.map(c=>c.v));return D.cats.map(c=>`<div class="bar"><span>${esc(c.n)}</span><div><i data-w="${c.v/m*100}"></i></div><b>${c.v}</b></div>`).join("")};
const line=()=>{const g=D.growth,m=Math.max(...g),p=g.map((v,i)=>`${20+i*(360/(g.length-1))},${150-v/m*130}`).join(" ");return `<svg viewBox="0 0 400 170" role="img" aria-label="Catalogue growth, ${g[0]} to ${g[g.length-1]} titles"><polyline class="dr" points="${p}" fill="none" stroke="var(--ac)" stroke-width="3" stroke-linecap="round" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2s ease"/>${g.map((v,i)=>`<circle cx="${20+i*(360/(g.length-1))}" cy="${150-v/m*130}" r="4" fill="var(--br)"/>`).join("")}</svg>`};
const books=(cat)=>{const cs=["All",...new Set(D.books.map(b=>b.c))];return `<div class="ch" role="group" aria-label="Filter">${cs.map(c=>`<button aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div><div class="gr">${D.books.map((b,i)=>cat==="All"||b.c===cat?cover(b,i):"").join("")}</div>`};
const svc=()=>Object.entries(SV).map(([k,v])=>`<div class="card rv"><h3>${v[0]}</h3><p class="mut">${v[1]}</p><a class="l" href="#/services/${k}">Explore →</a></div>`).join("");
const R={
"":()=>`<div class="w"><section class="hero"><div><span class="eb">Publisher · Aggregator · Licensor — New Delhi</span><h1>Knowledge, made ready for <span class="rot" id="rt">books</span>.</h1><p class="mut" style="max-width:52ch;margin:24px 0 32px;font-size:1.12rem">3S Learning publishes original titles, aggregates the work of many authors, and licenses trusted content to the platforms, institutions and AI developers that need it.</p><a class="btn" href="#/services">What we do</a> <a class="btn g" href="#catalogue">Browse the catalogue</a></div><div class="shelf" id="sh" aria-hidden="true">${shelf()}</div></section></div>
<div class="st rv" style="max-width:1160px;margin:auto">${D.stats.map(s=>`<div><b data-n="${s.v}" data-s="${s.s}">0</b><span class="mut">${esc(s.l)}</span></div>`).join("")}</div>
<section class="s"><div class="w"><span class="eb">Three businesses, one catalogue</span><h2 style="max-width:18ch;margin-bottom:40px">Publish. Aggregate. License.</h2><div class="g3">${svc()}</div></div></section>
<section class="s dk"><div class="w viz"><div class="rv"><span class="eb">The catalogue in numbers</span><h2>Depth across every stage of learning.</h2><p class="mut">Titles by domain, and the growth of our rights-cleared library.</p><div style="margin-top:24px;color:#fff">${line()}</div></div><div class="rv" style="align-self:center">${bars()}</div></div></section>
<section class="s" id="catalogue"><div class="w"><span class="eb">The catalogue</span><h2>Many authors. Many ways to learn.</h2><div id="bkc">${books("All")}</div><p class="mut" style="font-size:.85rem;margin-top:20px">Select a title for details. Titles shown are illustrative until updated by the admin.</p></div></section>
<section class="s" style="padding-top:0"><div class="w"><span class="eb">Insights</span><h2 style="margin-bottom:30px">Perspectives from our desk.</h2><div class="g3">${D.insights.map(i=>`<article class="card rv"><span class="eb">${esc(i.c)} · ${esc(i.dt)}</span><h3>${esc(i.t)}</h3><p class="mut">${esc(i.d)}</p></article>`).join("")}</div></div></section>
<section class="s dk"><div class="w" style="text-align:center"><h2 style="max-width:20ch;margin:auto" class="rv">Have content to license, or a title to publish?</h2><p style="margin:24px 0"><a class="btn" style="background:var(--ac)" href="#/contact">Start a conversation</a></p></div></section>`,
about:()=>`<div class="w pg"><span class="eb">About</span><h1>Built on the belief that good content outlives formats.</h1><p class="mut" style="margin-top:28px;font-size:1.1rem">3S Learning Private Limited is a New Delhi–based book publisher, content aggregator and licensor. We work with authors, institutions and technology companies to make trustworthy learning content available wherever it is needed.</p><div class="g3" style="margin:40px 0"><div class="card"><h3>Substance</h3><p class="mut">Editorial rigour first. Every title is reviewed, structured and described properly.</p></div><div class="card"><h3>Stewardship</h3><p class="mut">Authors are partners. Rights, credit and consent are never an afterthought.</p></div><div class="card"><h3>Scale</h3><p class="mut">One governed catalogue, ready for print, digital, platforms and data.</p></div></div><div class="ph">Registered office: ${esc(D.addr)}</div></div>`,
services:()=>`<div class="w pg"><span class="eb">Services</span><h1>Four ways we work with you.</h1><div class="g3" style="margin-top:40px">${svc()}</div></div>`,
industries:()=>`<div class="w pg"><span class="eb">Industries</span><h1>Content for every sector that learns.</h1><div class="g3" style="margin-top:40px">${D.inds.map(i=>`<div class="card rv"><h3>${esc(i.n)}</h3><p class="mut">${esc(i.d)}</p></div>`).join("")}</div></div>`,
insights:()=>`<div class="w pg"><span class="eb">Insights</span><h1>Ideas on publishing, rights and content.</h1><div class="g3" style="margin-top:40px">${D.insights.map(i=>`<article class="card rv"><span class="eb">${esc(i.c)} · ${esc(i.dt)}</span><h3>${esc(i.t)}</h3><p class="mut">${esc(i.d)}</p></article>`).join("")}</div></div>`,
careers:()=>`<div class="w pg"><span class="eb">Careers</span><h1>Help us shape what people read and learn.</h1><div style="margin-top:40px">${D.jobs.map(j=>`<div class="card rv" style="margin-bottom:16px"><h3>${esc(j.t)}</h3><p class="mut" style="margin:4px 0">${esc(j.l)}</p><p>${esc(j.d)}</p><a class="l" style="color:var(--ac)" href="mailto:${esc(D.email)}?subject=${encodeURIComponent("Application: "+j.t)}">Apply by email →</a></div>`).join("")}</div></div>`,
contact:()=>`<div class="w pg"><span class="eb">Contact</span><h1>Let's talk content.</h1><p class="mut">${esc(D.addr)} · <a href="mailto:${esc(D.email)}">${esc(D.email)}</a></p><form id="cf" style="max-width:560px"><label for="n">Name</label><input id="n" required autocomplete="name"><label for="e">Email</label><input id="e" type="email" required autocomplete="email"><label for="t">Interest</label><select id="t"><option>Content licensing</option><option>Book publishing</option><option>Aggregation</option><option>AI training content</option><option>Other</option></select><label for="g">Message</label><textarea id="g" rows="5" required></textarea><p><button class="btn" type="submit">Send message</button></p><p class="mut" style="font-size:.85rem">Opens your email app with the message prepared. We never store form data on this site.</p></form></div>`,
privacy:()=>`<div class="w pg"><span class="eb">Legal</span><h1>Privacy Policy</h1><p class="mut">This site does not use advertising trackers. We collect only what you choose to send us by email, and use it to reply to you. We do not sell personal data. Contact ${esc(D.email)} to access or delete anything you have shared. This summary is a template; have it reviewed against the DPDP Act, 2023 before launch.</p></div>`,
terms:()=>`<div class="w pg"><span class="eb">Legal</span><h1>Terms & Disclaimer</h1><p class="mut">All content on this site is owned by or licensed to 3S Learning Private Limited and may not be copied or used to train machine-learning models without written permission. Titles and authors shown may be illustrative. Information is provided as-is without warranty. Governing law: India; jurisdiction: New Delhi courts. Template text — please have it reviewed by counsel.</p></div>`};
function page(k){const [r,s]=k;if(r==="services"&&SV[s]){const v=SV[s];return `<div class="w pg"><a href="#/services" class="mut">← Services</a><h1 style="margin-top:16px">${v[0]}</h1><p class="serif" style="font-size:1.5rem;margin:20px 0">${v[1]}</p><p class="mut">${v[2]}</p><h2>What's included</h2><ul>${v[3].map(x=>`<li>${x}</li>`).join("")}</ul><p style="margin-top:32px"><a class="btn" href="#/contact">Talk to us</a></p></div>`}return (R[r]||R[""])()}
function nav(r){$("#nv").innerHTML=NAV.map(n=>`<a href="#/${n[0]}" ${n[0]===r?'aria-current="page"':""}>${n[1]}</a>`).join("");$("#nv").classList.remove("o");$("#mb").setAttribute("aria-expanded","false")}
function route(){const k=location.hash.replace(/^#\/?/,"").split("/"),r=k[0]||"";if(!["","about","services","industries","insights","careers","contact","privacy","terms"].includes(r)&&r!=="catalogue"){k[0]=""}
if(r==="catalogue")return;$("#m").innerHTML=page(k);nav(k[0]);scrollTo(0,0);document.title=(k[0]?k[0][0].toUpperCase()+k[0].slice(1)+" — ":"")+"3S Learning Private Limited";rv();hero();$("#m").focus({preventScroll:true})}
function hero(){const rt=$("#rt");if(!rt)return;const w=["books","licensing","platforms","AI"];let i=0;clearInterval(window._t);window._t=setInterval(()=>{if(!$("#rt"))return clearInterval(window._t);rt.style.opacity=0;setTimeout(()=>{i=(i+1)%4;rt.textContent=w[i];rt.style.opacity=1},300)},2600);rt.style.transition="opacity .3s";
const sh=$("#sh");matchMedia("(pointer:fine)").matches&&addEventListener("mousemove",e=>{if(sh.isConnected)sh.style.transform=`rotateY(${(e.clientX/innerWidth-.5)*14}deg)`})}
addEventListener("hashchange",route);
document.addEventListener("click",e=>{const c=e.target.closest("[data-c]");if(c){$("#bkc").innerHTML=books(c.dataset.c);return}
const b=e.target.closest(".bk");if(b){const k=D.books[+b.dataset.i],d=$("#bd");d.innerHTML=`<span class="eb">${esc(k.c)} · ${esc(k.y)}</span><h3>${esc(k.t)}</h3><p class="mut">by ${esc(k.a)}</p><p>${esc(k.d)}</p><p><a class="btn" href="#/contact" onclick="$('#bd').close()">Enquire about rights</a> <button class="btn g" onclick="$('#bd').close()">Close</button></p>`;d.showModal()}});
document.addEventListener("submit",e=>{if(e.target.id==="cf"){e.preventDefault();location.href=`mailto:${D.email}?subject=${encodeURIComponent($("#t").value+" — "+$("#n").value)}&body=${encodeURIComponent($("#g").value+"\n\nFrom: "+$("#e").value)}`}});
$("#mb").onclick=()=>{const o=$("#nv").classList.toggle("o");$("#mb").setAttribute("aria-expanded",o)};
$("#ft").innerHTML=`<div><a class="logo" href="#/"><i></i>3S Learning</a><p class="mut">3S Learning Private Limited<br>${esc(D.addr)}<br>${esc(D.email)}</p></div><div><b>Company</b><a href="#/about">About</a><a href="#/careers">Careers</a><a href="#/contact">Contact</a></div><div><b>Legal</b><a href="#/privacy">Privacy</a><a href="#/terms">Terms & Disclaimer</a><p class="mut">© ${new Date().getFullYear()} 3S Learning</p></div>`;
route();
/* Owner-only admin: edits are saved by publishing a new version of this page */
(async()=>{try{const u=await claude.use("user");if(!u||!u.isOwner())return;const a=await claude.use("artifact");if(!a)return;const ab=$("#ad"),ap=$("#ap");ab.style.display="block";
const keys=["books","insights","jobs","inds","stats","cats","growth"];
const fill=()=>{$("#ta").value=JSON.stringify(D[$("#sk").value],null,1)};
ab.onclick=()=>{ap.innerHTML=`<h3>Update site content</h3><p class="mut" style="font-size:.85rem">Choose a section, edit the JSON (add, change or remove items), then publish. Visitors see changes immediately.</p><label for="sk">Section</label><select id="sk">${keys.map(k=>`<option>${k}</option>`).join("")}</select><label for="ta">Content (JSON)</label><textarea id="ta" spellcheck="false"></textarea><p id="er" class="mut" role="status"></p><p><button class="btn" id="pb">Publish changes</button> <button class="btn g" id="cb">Close</button></p><p class="mut" style="font-size:.8rem">Contact email and address: edit the "email" / "addr" values via the Claude chat.</p>`;ap.showModal();fill();$("#sk").onchange=fill;$("#cb").onclick=()=>ap.close();
$("#pb").onclick=async()=>{try{D[$("#sk").value]=JSON.parse($("#ta").value)}catch(x){$("#er").textContent="Invalid JSON: "+x.message;return}
const html=SRC.replace(/(<script type="application\/json" id="d">)[\s\S]*?(<\/script>)/,(m,x,y)=>x+JSON.stringify(D).replace(/</g,"\\u003c")+y);$("#er").textContent="Publishing…";try{await a.publish(html)}catch(x){$("#er").textContent="Could not publish: "+(x.code||x.message)}}}}catch(x){}})();
</script>
</body>
</html>
